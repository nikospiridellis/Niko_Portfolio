<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko Spiridellis — Photography</title>
    <meta name="description" content="Photography by Niko Spiridellis. New York, Madrid, Buenos Aires and beyond.">
    <meta name="theme-color" content="#0e0e0e">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <header class="site-header">
        <a href="#/" class="wordmark">Niko Spiridellis</a>
        <nav>
            <a href="#/" data-nav="feed">Feed</a>
            <a href="#/archive" data-nav="archive">Archive</a>
            <a href="#contact" data-nav="contact">Contact</a>
        </nav>
    </header>

    <main id="view" aria-live="polite"></main>

    <footer id="contact" class="site-footer">
        <img class="footer-portrait" id="portrait" alt="Niko Spiridellis" loading="lazy" decoding="async" hidden>
        <p class="footer-line">Photos my eyes saw first</p>
        <ul class="contact-list">
            <li><span>Email</span><a href="mailto:nikospiridellis@gmail.com">nikospiridellis@gmail.com</a></li>
            <li><span>Instagram (film)</span><a href="https://www.instagram.com/slim.fotos/" target="_blank" rel="noopener">@slim.fotos</a></li>
            <li><span>Instagram (personal)</span><a href="https://www.instagram.com/niko_spiridellis/" target="_blank" rel="noopener">@niko_spiridellis</a></li>
        </ul>
        <p class="copyright">© <span id="year"></span> Niko Spiridellis</p>
    </footer>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lb-close" aria-label="Close">Close</button>
        <button class="lb-prev" aria-label="Previous photo">←</button>
        <figure class="lb-figure">
            <img class="lb-img" alt="">
            <figcaption class="lb-caption"></figcaption>
        </figure>
        <button class="lb-next" aria-label="Next photo">→</button>
        <div class="lb-count"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
